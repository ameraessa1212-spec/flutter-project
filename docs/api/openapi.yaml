openapi: 3.0.3
info:
  title: Waslaa Mobile API
  description: |
    ## Overview
    Waslaa is a platform that connects students with field training (internship) opportunities.
    Students can browse opportunities, submit applications, track their internships,
    communicate with supervisors, and upload academic reports.

    ## Base URL
    All mobile API endpoints are prefixed with `/api/mobile/v1`.

    ## Authentication
    Most endpoints require a **Bearer token** obtained from the Login endpoint.
    Include the token in the `Authorization` header:
    ```
    Authorization: Bearer <your_token>
    ```

    ## Response Format
    All responses return JSON. Paginated responses follow this structure:
    ```json
    {
      "data": [...],
      "links": { "first": "...", "last": "...", "prev": null, "next": "..." },
      "meta": { "current_page": 1, "last_page": 5, "per_page": 15, "total": 75 }
    }
    ```

    ## Error Handling
    - `422 Unprocessable Entity` — Validation errors (see `errors` field)
    - `401 Unauthorized` — Missing or invalid token
    - `403 Forbidden` — Not authorized to access this resource
    - `404 Not Found` — Resource does not exist

    ## OTP Note
    During development, the OTP code is always `6666`.

  version: 1.0.0
  contact:
    name: Waslaa API Support

servers:
  - url: http://localhost:8000/api/mobile/v1
    description: Local Development Server
  - url: https://your-domain.com/api/mobile/v1
    description: Production Server

tags:
  - name: Authentication
    description: Register, login, OTP verification, and logout
  - name: Password
    description: Forgot password, verify OTP, and reset password
  - name: Content
    description: Static content pages (no authentication required)
  - name: Profile
    description: View and update the authenticated user profile
  - name: Specializations
    description: List academic specializations
  - name: Companies
    description: Browse training companies
  - name: Opportunities
    description: Browse and apply to internship opportunities
  - name: Applications
    description: Manage submitted internship applications
  - name: Internships
    description: View active and past internships
  - name: Reports
    description: Upload and manage internship reports
  - name: Chat
    description: Chat threads and messages with supervisors
  - name: Notifications
    description: In-app notifications
  - name: Discussion Schedules
    description: Academic discussion schedule announcements
  - name: Settings
    description: User app settings

security: []

paths:

  # ───────────────────────────────────────────────
  # AUTHENTICATION
  # ───────────────────────────────────────────────

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new student account
      description: |
        Creates a new student account. The account will be in `pending` status
        until the OTP is verified via `/auth/verify-otp`.
      operationId: auth.register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - username
                - email
                - phone
                - password
                - password_confirmation
              properties:
                first_name:
                  type: string
                  maxLength: 100
                  example: Ahmed
                last_name:
                  type: string
                  maxLength: 100
                  example: Al-Rashidi
                username:
                  type: string
                  maxLength: 100
                  example: ahmed_rashidi
                email:
                  type: string
                  format: email
                  example: ahmed@example.com
                phone:
                  type: string
                  maxLength: 20
                  example: "0501234567"
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "Secret123!"
                password_confirmation:
                  type: string
                  format: password
                  example: "Secret123!"
                student_number:
                  type: string
                  maxLength: 50
                  nullable: true
                  example: "2021001234"
                specialization_id:
                  type: integer
                  nullable: true
                  example: 3
      responses:
        "201":
          description: Registration successful — OTP verification required
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Registration completed. Please verify OTP to activate account.
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        example: 42
                      status:
                        type: string
                        example: pending
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/verify-otp:
    post:
      tags: [Authentication]
      summary: Verify OTP to activate account
      description: |
        Verify the OTP code sent to the user's phone/email.
        **Development note:** The OTP code is always `6666`.
      operationId: auth.verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - otp
              properties:
                identifier:
                  type: string
                  description: The user's email or phone number
                  example: ahmed@example.com
                otp:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: "6666"
      responses:
        "200":
          description: OTP verified — account is now active
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OTP verified successfully.
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        example: 42
                      status:
                        type: string
                        example: active
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login and obtain access token
      description: |
        Authenticate using email, username, or phone number along with the password.
        Returns a Sanctum Bearer token to be used in subsequent requests.
      operationId: auth.login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login
                - password
              properties:
                login:
                  type: string
                  description: Email, username, or phone number
                  example: ahmed@example.com
                password:
                  type: string
                  format: password
                  example: "Secret123!"
                device_name:
                  type: string
                  maxLength: 100
                  nullable: true
                  example: "iPhone 15 Pro"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful.
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 1|abcdef1234567890...
                      token_type:
                        type: string
                        example: Bearer
                      user:
                        $ref: "#/components/schemas/User"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the currently authenticated user
      operationId: auth.me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout from current device
      description: Revokes the current access token.
      operationId: auth.logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout-all:
    post:
      tags: [Authentication]
      summary: Logout from all devices
      description: Revokes all access tokens for the authenticated user.
      operationId: auth.logoutAll
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out from all devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ───────────────────────────────────────────────
  # PASSWORD
  # ───────────────────────────────────────────────

  /auth/password/forgot:
    post:
      tags: [Password]
      summary: Request password reset OTP
      description: Sends a password reset OTP to the user's registered email or phone.
      operationId: password.forgot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
              properties:
                identifier:
                  type: string
                  description: Email or phone number
                  example: ahmed@example.com
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/password/verify:
    post:
      tags: [Password]
      summary: Verify password reset OTP
      description: |
        Verifies the OTP code for password reset.
        **Development note:** The OTP code is always `6666`.
      operationId: password.verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - otp
              properties:
                identifier:
                  type: string
                  example: ahmed@example.com
                otp:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: "6666"
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/password/reset:
    post:
      tags: [Password]
      summary: Reset password
      description: Resets the password using a verified OTP.
      operationId: password.reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - otp
                - password
                - password_confirmation
              properties:
                identifier:
                  type: string
                  example: ahmed@example.com
                otp:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: "6666"
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "NewSecret123!"
                password_confirmation:
                  type: string
                  format: password
                  example: "NewSecret123!"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ───────────────────────────────────────────────
  # CONTENT (no auth)
  # ───────────────────────────────────────────────

  /content/about-app:
    get:
      tags: [Content]
      summary: Get About App content
      operationId: content.aboutApp
      responses:
        "200":
          description: About App page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPage"

  /content/terms:
    get:
      tags: [Content]
      summary: Get Terms & Conditions
      operationId: content.terms
      responses:
        "200":
          description: Terms and Conditions content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPage"

  /content/privacy:
    get:
      tags: [Content]
      summary: Get Privacy Policy
      operationId: content.privacy
      responses:
        "200":
          description: Privacy Policy content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPage"

  /content/about-us:
    get:
      tags: [Content]
      summary: Get About Us content
      operationId: content.aboutUs
      responses:
        "200":
          description: About Us content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPage"

  # ───────────────────────────────────────────────
  # PROFILE
  # ───────────────────────────────────────────────

  /profile:
    get:
      tags: [Profile]
      summary: Get authenticated user profile
      operationId: profile.show
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      tags: [Profile]
      summary: Update profile information
      operationId: profile.update
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  maxLength: 100
                  example: Ahmed
                last_name:
                  type: string
                  maxLength: 100
                  example: Al-Rashidi
                name:
                  type: string
                  maxLength: 255
                  example: Ahmed Al-Rashidi
                username:
                  type: string
                  maxLength: 100
                  example: ahmed_new
                email:
                  type: string
                  format: email
                  example: ahmed_new@example.com
                phone:
                  type: string
                  maxLength: 20
                  example: "0509876543"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Profile updated successfully.
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /profile/password:
    patch:
      tags: [Profile]
      summary: Change password
      operationId: profile.updatePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - password
                - password_confirmation
              properties:
                current_password:
                  type: string
                  format: password
                  example: "OldSecret123!"
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "NewSecret123!"
                password_confirmation:
                  type: string
                  format: password
                  example: "NewSecret123!"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /profile/avatar:
    post:
      tags: [Profile]
      summary: Upload profile avatar
      description: "Upload a profile photo. Supported formats: jpg, jpeg, png, webp (max 5 MB)."
      operationId: profile.uploadAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Image file (jpg, jpeg, png, webp — max 5 MB)
      responses:
        "201":
          description: Avatar uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Avatar uploaded successfully.
                  data:
                    type: object
                    properties:
                      path:
                        type: string
                        example: mobile/profile-avatars/avatar123.jpg
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /profile/cv:
    post:
      tags: [Profile]
      summary: Upload CV / Resume
      description: "Upload a CV file. Supported formats: pdf, doc, docx (max 10 MB)."
      operationId: profile.uploadCv
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - cv
              properties:
                cv:
                  type: string
                  format: binary
                  description: CV file (pdf, doc, docx — max 10 MB)
      responses:
        "201":
          description: CV uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: CV uploaded successfully.
                  data:
                    type: object
                    properties:
                      path:
                        type: string
                        example: mobile/student-cv/cv123.pdf
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ───────────────────────────────────────────────
  # SPECIALIZATIONS
  # ───────────────────────────────────────────────

  /specializations:
    get:
      tags: [Specializations]
      summary: List all active specializations
      description: Returns all active academic specializations. Used when registering or filtering opportunities.
      operationId: specializations.index
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of specializations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Specialization"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ───────────────────────────────────────────────
  # COMPANIES
  # ───────────────────────────────────────────────

  /companies:
    get:
      tags: [Companies]
      summary: List training companies
      operationId: companies.index
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by name, description, or city
          example: Tech
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of companies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCompanies"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /companies/{company}:
    get:
      tags: [Companies]
      summary: Get company details
      operationId: companies.show
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Company details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Company"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ───────────────────────────────────────────────
  # OPPORTUNITIES
  # ───────────────────────────────────────────────

  /opportunities:
    get:
      tags: [Opportunities]
      summary: List internship opportunities
      operationId: opportunities.index
      security:
        - bearerAuth: []
      parameters:
        - name: specialization_id
          in: query
          schema:
            type: integer
          description: Filter by specialization ID
          example: 3
        - name: city
          in: query
          schema:
            type: string
          description: Filter by city
          example: Riyadh
        - name: is_available
          in: query
          schema:
            type: boolean
          description: Filter by availability
          example: true
        - name: search
          in: query
          schema:
            type: string
          description: Search in title or description
          example: software
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of opportunities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOpportunities"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /opportunities/{opportunity}:
    get:
      tags: [Opportunities]
      summary: Get opportunity details
      operationId: opportunities.show
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      responses:
        "200":
          description: Opportunity details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Opportunity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /opportunities/{opportunity}/applications:
    post:
      tags: [Opportunities]
      summary: Apply to an internship opportunity
      description: |
        Submit an application for the specified opportunity.
        A CV file can be optionally attached. Supported formats: pdf, doc, docx (max 10 MB).
      operationId: opportunities.applications.store
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - full_name_snapshot
              properties:
                full_name_snapshot:
                  type: string
                  maxLength: 255
                  example: Ahmed Al-Rashidi
                phone_snapshot:
                  type: string
                  maxLength: 20
                  nullable: true
                  example: "0501234567"
                email_snapshot:
                  type: string
                  format: email
                  nullable: true
                  example: ahmed@example.com
                university_snapshot:
                  type: string
                  maxLength: 255
                  nullable: true
                  example: King Saud University
                major_snapshot:
                  type: string
                  maxLength: 255
                  nullable: true
                  example: Computer Science
                level_snapshot:
                  type: string
                  maxLength: 255
                  nullable: true
                  example: Level 8
                notes:
                  type: string
                  maxLength: 2000
                  nullable: true
                  example: I am very interested in this position.
                cv:
                  type: string
                  format: binary
                  description: Optional CV file (pdf, doc, docx — max 10 MB)
      responses:
        "201":
          description: Application submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Application submitted successfully.
                  data:
                    $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ───────────────────────────────────────────────
  # APPLICATIONS
  # ───────────────────────────────────────────────

  /applications:
    get:
      tags: [Applications]
      summary: List my applications
      description: Returns all internship applications submitted by the authenticated student.
      operationId: applications.index
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedApplications"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /applications/{application}:
    get:
      tags: [Applications]
      summary: Get application details
      operationId: applications.show
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Application details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Applications]
      summary: Withdraw an application
      description: Withdraws the application (sets status to `withdrawn`).
      operationId: applications.destroy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Application withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ───────────────────────────────────────────────
  # INTERNSHIPS
  # ───────────────────────────────────────────────

  /internships:
    get:
      tags: [Internships]
      summary: List my internships
      description: Returns all internships associated with the authenticated student.
      operationId: internships.index
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of internships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedInternships"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /internships/current:
    get:
      tags: [Internships]
      summary: Get current active internship
      description: Returns the most recently started active internship for the authenticated student.
      operationId: internships.current
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current internship (null if none active)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/Internship"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /internships/{internship}:
    get:
      tags: [Internships]
      summary: Get internship details
      operationId: internships.show
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InternshipId"
      responses:
        "200":
          description: Internship details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Internship"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /internships/{internship}/timeline:
    get:
      tags: [Internships]
      summary: Get internship timeline
      description: |
        Returns the progress timeline of an internship with these steps:
        - `application_accepted` — When the internship was created
        - `internship_started` — When the internship started
        - `report_due` — Report submission deadline
        - `internship_completed` — When the internship was completed

        Each step has a `status` of `done`, `upcoming`, or `pending`.
      operationId: internships.timeline
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InternshipId"
      responses:
        "200":
          description: Internship timeline steps
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          enum:
                            - application_accepted
                            - internship_started
                            - report_due
                            - internship_completed
                          example: internship_started
                        status:
                          type: string
                          enum: [done, upcoming, pending]
                          example: done
                        date:
                          type: string
                          format: date
                          nullable: true
                          example: "2024-09-01"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /internships/{internship}/reports:
    get:
      tags: [Internships]
      summary: List reports for an internship
      operationId: internships.reports.index
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InternshipId"
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Internships]
      summary: Upload a report for an internship
      description: |
        Upload a training report for the specified internship.
        Supported formats: pdf, doc, docx (max 10 MB).

        Report types:
        - `field_report` — Regular field training report
        - `research_paper` — Academic research paper
        - `other` — Other types
      operationId: internships.reports.store
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InternshipId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - report_type
                - title
                - file
              properties:
                report_type:
                  type: string
                  enum: [field_report, research_paper, other]
                  example: field_report
                title:
                  type: string
                  maxLength: 255
                  example: Weekly Field Report - Week 3
                file:
                  type: string
                  format: binary
                  description: Report file (pdf, doc, docx — max 10 MB)
      responses:
        "201":
          description: Report uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Report uploaded successfully.
                  data:
                    $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ───────────────────────────────────────────────
  # REPORTS
  # ───────────────────────────────────────────────

  /reports/{report}:
    get:
      tags: [Reports]
      summary: Get report details
      operationId: reports.show
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Report details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Reports]
      summary: Delete a report
      operationId: reports.destroy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Report deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /reports/{report}/download:
    get:
      tags: [Reports]
      summary: Get report download URL
      description: Returns the file path for downloading the report file.
      operationId: reports.download
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: File path for download
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      file_path:
                        type: string
                        example: mobile/reports/report_abc123.pdf
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ───────────────────────────────────────────────
  # CHAT
  # ───────────────────────────────────────────────

  /chat/threads:
    get:
      tags: [Chat]
      summary: List chat threads
      description: Returns all chat threads for the authenticated student, ordered by last message time.
      operationId: chat.threads.index
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of chat threads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedChatThreads"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /chat/threads/{thread}:
    get:
      tags: [Chat]
      summary: Get chat thread details
      operationId: chat.threads.show
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: Chat thread details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ChatThread"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /chat/threads/{thread}/messages:
    get:
      tags: [Chat]
      summary: List messages in a thread
      operationId: chat.messages.index
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMessages"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Chat]
      summary: Send a text message
      operationId: chat.messages.store
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
                  maxLength: 4000
                  example: Hello, I have a question about the training schedule.
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /chat/threads/{thread}/attachments:
    post:
      tags: [Chat]
      summary: Send a message with attachment
      description: |
        Upload and send a file/image attachment in a chat thread.
        Maximum file size: 15 MB.

        Message types:
        - `image` — Image file
        - `file` — Other file types
      operationId: chat.messages.attachments.store
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - attachment
              properties:
                attachment:
                  type: string
                  format: binary
                  description: File attachment (max 15 MB)
                message_type:
                  type: string
                  enum: [image, file]
                  nullable: true
                  example: image
                body:
                  type: string
                  maxLength: 1000
                  nullable: true
                  example: Please check the attached file.
      responses:
        "201":
          description: Attachment sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /chat/threads/{thread}/read:
    post:
      tags: [Chat]
      summary: Mark thread messages as read
      description: Marks all unread messages in the specified thread as read.
      operationId: chat.messages.read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: Messages marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ───────────────────────────────────────────────
  # NOTIFICATIONS
  # ───────────────────────────────────────────────

  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      description: Returns all notifications for the authenticated user, newest first.
      operationId: notifications.index
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedNotifications"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread notifications count
      operationId: notifications.unreadCount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unread_count:
                        type: integer
                        example: 5
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/{notification}/read:
    patch:
      tags: [Notifications]
      summary: Mark a notification as read
      operationId: notifications.read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all notifications as read
      operationId: notifications.readAll
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All notifications marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ───────────────────────────────────────────────
  # DISCUSSION SCHEDULES
  # ───────────────────────────────────────────────

  /discussion-schedules:
    get:
      tags: [Discussion Schedules]
      summary: List discussion schedules
      description: Returns published academic discussion schedules, filterable by specialization and academic term.
      operationId: discussionSchedules.index
      security:
        - bearerAuth: []
      parameters:
        - name: specialization_id
          in: query
          schema:
            type: integer
          description: Filter by specialization
          example: 3
        - name: academic_term
          in: query
          schema:
            type: string
            maxLength: 100
          description: Filter by academic term
          example: "2024-2025-1"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of schedules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDiscussionSchedules"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /discussion-schedules/{schedule}:
    get:
      tags: [Discussion Schedules]
      summary: Get discussion schedule details
      operationId: discussionSchedules.show
      security:
        - bearerAuth: []
      parameters:
        - name: schedule
          in: path
          required: true
          schema:
            type: integer
          description: Discussion schedule ID
          example: 1
      responses:
        "200":
          description: Schedule details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DiscussionSchedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ───────────────────────────────────────────────
  # SETTINGS
  # ───────────────────────────────────────────────

  /settings:
    get:
      tags: [Settings]
      summary: Get user settings
      description: Returns the current user settings. Creates default settings if none exist.
      operationId: settings.show
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserSetting"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      tags: [Settings]
      summary: Update user settings
      operationId: settings.update
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
                  maxLength: 10
                  example: ar
                  description: Language code (e.g., `ar`, `en`)
                push_notifications_enabled:
                  type: boolean
                  example: true
                email_notifications_enabled:
                  type: boolean
                  example: true
                chat_notifications_enabled:
                  type: boolean
                  example: true
                theme:
                  type: string
                  maxLength: 20
                  example: dark
                  description: App theme (`light` or `dark`)
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Settings updated successfully.
                  data:
                    $ref: "#/components/schemas/UserSetting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

# ───────────────────────────────────────────────
# COMPONENTS
# ───────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: |
        Laravel Sanctum token obtained from the `/auth/login` endpoint.
        Pass it as: `Authorization: Bearer <token>`

  parameters:
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
      description: Number of results per page
      example: 15

    CompanyId:
      name: company
      in: path
      required: true
      schema:
        type: integer
      description: Company ID
      example: 1

    OpportunityId:
      name: opportunity
      in: path
      required: true
      schema:
        type: integer
      description: Internship opportunity ID
      example: 1

    ApplicationId:
      name: application
      in: path
      required: true
      schema:
        type: integer
      description: Application ID
      example: 1

    InternshipId:
      name: internship
      in: path
      required: true
      schema:
        type: integer
      description: Internship ID
      example: 1

    ReportId:
      name: report
      in: path
      required: true
      schema:
        type: integer
      description: Report ID
      example: 1

    ThreadId:
      name: thread
      in: path
      required: true
      schema:
        type: integer
      description: Chat thread ID
      example: 1

    NotificationId:
      name: notification
      in: path
      required: true
      schema:
        type: integer
      description: Notification ID
      example: 1

  schemas:
    # ── Core Domain Models ──

    User:
      type: object
      properties:
        id:
          type: integer
          example: 42
        first_name:
          type: string
          example: Ahmed
        last_name:
          type: string
          example: Al-Rashidi
        name:
          type: string
          example: Ahmed Al-Rashidi
        username:
          type: string
          example: ahmed_rashidi
        email:
          type: string
          format: email
          example: ahmed@example.com
        phone:
          type: string
          example: "0501234567"
        role:
          type: string
          example: student
        status:
          type: string
          enum: [pending, active, suspended]
          example: active
        email_verified_at:
          type: string
          format: date-time
          nullable: true
          example: "2024-09-01T10:00:00+03:00"
        phone_verified_at:
          type: string
          format: date-time
          nullable: true
          example: "2024-09-01T10:00:00+03:00"
        last_login_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-01-15T08:30:00+03:00"
        student_profile:
          $ref: "#/components/schemas/StudentProfile"
        settings:
          $ref: "#/components/schemas/UserSetting"

    StudentProfile:
      type: object
      nullable: true
      properties:
        id:
          type: integer
          example: 10
        university_name:
          type: string
          nullable: true
          example: King Saud University
        student_number:
          type: string
          nullable: true
          example: "2021001234"
        study_level:
          type: string
          nullable: true
          example: Level 8
        bio:
          type: string
          nullable: true
          example: Computer Science student passionate about AI.
        profile_image_path:
          type: string
          nullable: true
          example: mobile/profile-avatars/avatar123.jpg
        cv_file_path:
          type: string
          nullable: true
          example: mobile/student-cv/cv123.pdf
        expected_graduation_at:
          type: string
          format: date
          nullable: true
          example: "2025-06-01"
        specialization:
          $ref: "#/components/schemas/Specialization"

    UserSetting:
      type: object
      properties:
        id:
          type: integer
          example: 1
        language:
          type: string
          example: ar
        push_notifications_enabled:
          type: boolean
          example: true
        email_notifications_enabled:
          type: boolean
          example: true
        chat_notifications_enabled:
          type: boolean
          example: true
        theme:
          type: string
          example: light

    Specialization:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Computer Science
        code:
          type: string
          nullable: true
          example: CS
        is_active:
          type: boolean
          example: true

    Company:
      type: object
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: Acme Tech Co.
        slug:
          type: string
          example: acme-tech-co
        description:
          type: string
          nullable: true
          example: A leading technology company.
        logo_path:
          type: string
          nullable: true
          example: companies/logos/acme.png
        website_url:
          type: string
          nullable: true
          example: https://acme.example.com
        map_url:
          type: string
          nullable: true
          example: https://maps.google.com/?q=acme
        city:
          type: string
          nullable: true
          example: Riyadh
        address:
          type: string
          nullable: true
          example: King Fahd Road, Riyadh
        phone:
          type: string
          nullable: true
          example: "+966112345678"
        email:
          type: string
          nullable: true
          example: info@acme.example.com
        is_active:
          type: boolean
          example: true

    Opportunity:
      type: object
      properties:
        id:
          type: integer
          example: 7
        title:
          type: string
          example: Software Engineering Intern
        description:
          type: string
          nullable: true
          example: Work with our engineering team on exciting projects.
        city:
          type: string
          nullable: true
          example: Riyadh
        location_text:
          type: string
          nullable: true
          example: Riyadh, King Abdullah Financial District
        duration_text:
          type: string
          nullable: true
          example: 3 months
        duration_days:
          type: integer
          nullable: true
          example: 90
        seats_count:
          type: integer
          nullable: true
          example: 5
        is_available:
          type: boolean
          example: true
        status:
          type: string
          enum: [draft, published, closed]
          example: published
        start_date:
          type: string
          format: date
          nullable: true
          example: "2025-02-01"
        end_date:
          type: string
          format: date
          nullable: true
          example: "2025-05-01"
        application_deadline:
          type: string
          format: date
          nullable: true
          example: "2025-01-20"
        image_path:
          type: string
          nullable: true
          example: opportunities/images/opp7.jpg
        company:
          $ref: "#/components/schemas/Company"
        specialization:
          $ref: "#/components/schemas/Specialization"

    Application:
      type: object
      properties:
        id:
          type: integer
          example: 15
        status:
          type: string
          enum: [pending, accepted, rejected, withdrawn]
          example: pending
        full_name_snapshot:
          type: string
          example: Ahmed Al-Rashidi
        phone_snapshot:
          type: string
          nullable: true
          example: "0501234567"
        email_snapshot:
          type: string
          nullable: true
          example: ahmed@example.com
        university_snapshot:
          type: string
          nullable: true
          example: King Saud University
        major_snapshot:
          type: string
          nullable: true
          example: Computer Science
        level_snapshot:
          type: string
          nullable: true
          example: Level 8
        cv_file_path:
          type: string
          nullable: true
          example: mobile/applications/cv/cv123.pdf
        notes:
          type: string
          nullable: true
          example: I am very interested in this position.
        submitted_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-01-10T14:00:00+03:00"
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        review_notes:
          type: string
          nullable: true
        company:
          $ref: "#/components/schemas/Company"
        opportunity:
          $ref: "#/components/schemas/Opportunity"
        internship:
          $ref: "#/components/schemas/Internship"

    Internship:
      type: object
      properties:
        id:
          type: integer
          example: 3
        title:
          type: string
          nullable: true
          example: Software Engineering Intern at Acme
