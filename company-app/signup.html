<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل شركة جديدة - وصلة تدريب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="signup.css">
    <script src="config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

    <div class="signup-wrapper" x-data="signupForm()">
        <div class="signup-card fade-up">
            <div class="signup-header">
                <div class="logo">وصلة تدريب<span>.</span></div>
                <h2>تسجيل شركة جديدة</h2>
                <p>انضم إلينا وساهم في بناء مستقبل الكفاءات الشابة</p>
            </div>

            <div x-show="success" class="success-message" x-text="successMessage"></div>
            <div x-show="generalError" class="error-message" style="text-align:center; margin-bottom:15px;" x-text="generalError"></div>

            <form @submit.prevent="submit" class="grid-form" x-show="!success">
                
                <div class="form-group full-width upload-section">
                    <label>شعار الشركة</label>
                    <div class="logo-upload-container">
                        <div class="logo-preview" @click="$refs.logoInput.click()">
                            <template x-if="!logoPreview">
                                <div class="upload-placeholder">
                                    <i class="ri-image-add-line"></i>
                                    <span>اضغط لرفع الشعار</span>
                                </div>
                            </template>
                            <template x-if="logoPreview">
                                <img :src="logoPreview" class="preview-img">
                            </template>
                        </div>
                        <input type="file" x-ref="logoInput" class="hidden-input" accept="image/*" @change="handleLogoUpload($event)">
                        <p class="upload-hint">يفضل صيغة PNG بخلفية شفافة</p>
                    </div>
                </div>

                <div class="form-group">
                    <label>اسم الشركة</label>
                    <div class="input-box">
                        <i class="ri-building-line"></i>
                        <input type="text" x-model="formData.name" placeholder="مثلاً: شركة المدار الجديد" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <div class="input-box">
                        <i class="ri-mail-line"></i>
                        <input type="email" x-model="formData.email" placeholder="hr@company.ly" required>
                    </div>
                    <span class="error-message" x-show="errors.email" x-text="errors.email"></span>
                </div>

                <div class="form-group">
                    <label>كلمة المرور</label>
                    <div class="input-box">
                        <i class="ri-lock-password-line"></i>
                        <input type="password" x-model="formData.password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>تأكيد كلمة المرور</label>
                    <div class="input-box">
                        <i class="ri-lock-password-line"></i>
                        <input type="password" x-model="formData.password_confirmation" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>المدينة</label>
                    <div class="input-box">
                        <i class="ri-map-pin-line"></i>
                        <input type="text" x-model="formData.city" placeholder="طرابلس">
                    </div>
                </div>

                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <div class="input-box">
                        <i class="ri-phone-line"></i>
                        <input type="text" x-model="formData.phone" placeholder="091XXXXXXX">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label>نبذة عن الشركة</label>
                    <div class="input-box">
                        <i class="ri-information-line"></i>
                        <textarea x-model="formData.description" placeholder="تخصص الشركة وأهدافها..." rows="3"></textarea>
                    </div>
                </div>

                <button type="submit" class="submit-btn" :disabled="loading">
                    <span x-show="!loading">إرسال طلب الانضمام</span>
                    <span x-show="loading"><i class="ri-loader-4-line rotate"></i> جاري المعالجة...</span>
                </button>
            </form>

            <div class="signup-footer">
                <span>لديك حساب بالفعل؟</span>
                <a href="login.html">تسجيل الدخول</a>
            </div>
        </div>
    </div>

    <script>
        function signupForm() {
            return {
                formData: {
                    name: '', email: '', password: '', password_confirmation: '',
                    city: '', phone: '', description: '', logo: null
                },
                logoPreview: null,
                errors: {},
                generalError: null,
                loading: false,
                success: false,
                successMessage: '',

                handleLogoUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        this.formData.logo = file;
                        const reader = new FileReader();
                        reader.onload = (e) => { this.logoPreview = e.target.result; };
                        reader.readAsDataURL(file);
                    }
                },

                async submit() {
                    this.loading = true;
                    this.errors = {};
                    this.generalError = null;

                    // تحويل البيانات إلى FormData لدعم رفع الصور
                    const formPayload = new FormData();
                    Object.keys(this.formData).forEach(key => {
                        formPayload.append(key, this.formData[key]);
                    });

                    try {
                        const response = await fetch(CONFIG.API_URL + '/company/register', {
                            method: 'POST',
                            body: formPayload
                            // ملاحظة: لا نضع Content-Type عند إرسال FormData
                        });

                        const data = await response.json();

                        if (!response.ok) {
                            if (response.status === 422) {
                                Object.keys(data.errors).forEach(key => {
                                    this.errors[key] = data.errors[key][0];
                                });
                            } else {
                                this.generalError = data.message || 'حدث خطأ ما';
                            }
                        } else {
                            this.success = true;
                            this.successMessage = "تم التسجيل بنجاح! سيتم مراجعة شعار شركتك وبياناتك.";
                            setTimeout(() => { window.location.href = 'login.html'; }, 3000);
                        }
                    } catch (error) {
                        this.generalError = 'تعذر الاتصال بالسيرفر';
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
