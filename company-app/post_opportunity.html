<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة فرصة تدريب - وصلة تدريب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <script src="config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { background: transparent; margin: 0; padding: 20px; font-family: 'Cairo'; }
        .form-container { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #1e293b; }
        input[type="text"], input[type="number"], input[type="date"], select, textarea {
            width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-family: 'Cairo'; box-sizing: border-box;
        }
        textarea { resize: vertical; min-height: 100px; }
        .submit-btn {
            background: #6A5AE0; color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-family: 'Cairo';
        }
        .submit-btn:hover { background: #5b4dd0; }
        .flex-row { display: flex; gap: 20px; }
        .flex-row > .form-group { flex: 1; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; cursor: pointer; }
        .checkbox-group input { width: 20px; height: 20px; }
    </style>
</head>
<body x-data="opportunityForm()">

    <div class="form-container animate-fade">
        <h2 style="margin-top: 0; color: #1e293b; margin-bottom: 25px;"><i class="ri-add-circle-line" style="color: #6A5AE0; vertical-align: middle;"></i> إضافة فرصة تدريب جديدة</h2>
        
        <form @submit.prevent="submit">
            <div class="form-group">
                <label>عنوان الفرصة *</label>
                <input type="text" x-model="form.title" required placeholder="مثال: مطور واجهات خلفية (Laravel)">
            </div>
            
            <div class="form-group">
                <label>الوصف *</label>
                <textarea x-model="form.description" required placeholder="اكتب وصفاً شاملاً عن التدريب..."></textarea>
            </div>

            <div class="form-group">
                <label>المتطلبات / المهارات</label>
                <textarea x-model="form.requirements" placeholder="مثال: معرفة بأساسيات قواعد البيانات..."></textarea>
            </div>

            <div class="flex-row">
                <div class="form-group">
                    <label>الموقع *</label>
                    <input type="text" x-model="form.location" required placeholder="مثال: طرابلس، السياحية">
                </div>
                <div class="form-group">
                    <label>تاريخ البدء المتوقع</label>
                    <input type="date" x-model="form.start_date">
                </div>
            </div>

            <div class="flex-row">
                <div class="form-group">
                    <label>المدة (بالأشهر)</label>
                    <input type="number" x-model="form.duration_months" min="1" max="12" placeholder="3">
                </div>
                <div class="form-group">
                    <label>حالة النشر</label>
                    <select x-model="form.status">
                        <option value="draft">مسودة</option>
                        <option value="published">نشر (مرئي للطلاب)</option>
                    </select>
                </div>
            </div>

            <label class="checkbox-group">
                <input type="checkbox" x-model="form.is_remote">
                <span>التدريب عن بُعد (Remote)</span>
            </label>

            <button type="submit" class="submit-btn" :disabled="loading">
                <span x-show="!loading">حفظ ونشر</span>
                <span x-show="loading">جاري الحفظ...</span>
            </button>
        </form>
    </div>

    <script>
        function opportunityForm() {
            return {
                loading: false,
                form: {
                    title: '',
                    description: '',
                    requirements: '',
                    location: '',
                    is_remote: false,
                    duration_months: '',
                    start_date: '',
                    status: 'published'
                },

                async submit() {
                    this.loading = true;
                    try {
                        const payload = { ...this.form };
                        if (payload.duration_months) payload.duration_months = parseInt(payload.duration_months);

                        const response = await apiFetch('/company/opportunities', {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        });

                        const data = await response.json();
                        
                        if (response.ok) {
                            alert("تم إضافة الفرصة بنجاح!");
                            this.form.title = '';
                            this.form.description = '';
                            this.form.requirements = '';
                            this.form.location = '';
                            this.form.is_remote = false;
                        } else {
                            alert("خطأ: " + (data.message || 'تعذر الإضافة'));
                        }
                    } catch (error) {
                        alert("حدث خطأ في الاتصال.");
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
