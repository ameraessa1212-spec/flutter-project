<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - وصلة تدريب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .error-message { color: #e74c3c; font-size: 0.85rem; margin-top: 5px; }
        .rotate { animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-left: 8px; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="login-wrapper" x-data="loginForm()">
        <div class="login-card fade-up">
            <div class="login-header">
                <div class="login-logo">WASLAT TADREIB<span>.</span></div>
                <h2>مرحباً بك مجدداً</h2>
                <p>الرجاء إدخال بياناتك للوصول إلى لوحة التحكم</p>
            </div>

            <div x-show="generalError" class="error-message" style="text-align:center; font-size: 1rem; margin-bottom:15px; background: #fee; padding:10px; border-radius:5px;" x-text="generalError"></div>

            <form @submit.prevent="submit">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <div class="input-container">
                        <i class="ri-mail-line"></i>
                        <input type="email" x-model="formData.email" placeholder="name@company.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>كلمة المرور</label>
                    <div class="input-container">
                        <i class="ri-lock-password-line"></i>
                        <input type="password" x-model="formData.password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="login-btn" :disabled="loading">
                    <span x-show="!loading">دخول للمنصة</span>
                    <span x-show="loading"><i class="ri-loader-4-line rotate"></i> جاري الدخول...</span>
                    <i class="ri-arrow-left-line" x-show="!loading"></i>
                </button>
            </form>

            <div class="login-footer">
                <span>ليس لديك حساب؟</span>
                <a href="signup.html">سجل شركتك الآن</a>
            </div>
        </div>
    </div>

    <script>
        function loginForm() {
            return {
                formData: {
                    email: '',
                    password: ''
                },
                generalError: null,
                loading: false,

                async submit() {
                    this.loading = true;
                    this.generalError = null;

                    try {
                        const response = await fetch('http://127.0.0.1:8000/api/company/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json'
                            },
                            body: JSON.stringify(this.formData)
                        });

                        const data = await response.json();

                        if (!response.ok || !data.success) {
                            this.generalError = data.message || 'بيانات الدخول غير صحيحة';
                        } else {
                            // Save token
                            localStorage.setItem('company_token', data.data.token);
                            localStorage.setItem('company_user', JSON.stringify(data.data.user));
                            localStorage.setItem('company_profile', JSON.stringify(data.data.company));
                            
                            // Redirect to dashboard
                            window.location.href = 'dashboard.html';
                        }
                    } catch (error) {
                        this.generalError = 'غير قادر على الاتصال بالخادم.';
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
