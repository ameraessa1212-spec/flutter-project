<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة فرصة تدريب - وصلة تدريب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <script src="config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { background: transparent; margin: 0; padding: 20px; font-family: 'Cairo'; height: auto; overflow: auto; }
        .form-container { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #1e293b; }
        input[type="text"], input[type="number"], input[type="date"], select, textarea {
            width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-family: 'Cairo'; box-sizing: border-box;
        }
        textarea { resize: vertical; min-height: 100px; }
        .submit-btn {
            background: #6A5AE0; color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-family: 'Cairo';
        }
        .submit-btn:hover { background: #5b4dd0; }
        .flex-row { display: flex; gap: 20px; }
        .flex-row > .form-group { flex: 1; }
        .success-msg { background: #dcfce7; color: #166534; padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; display: none; }
        .error-msg { background: #fee2e2; color: #991b1b; padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; display: none; }
    </style>
</head>
<body x-data="opportunityForm()">

    <div class="form-container animate-fade">
        <h2 style="margin-top: 0; color: #1e293b; margin-bottom: 25px;"><i class="ri-add-circle-line" style="color: #6A5AE0; vertical-align: middle;"></i> إضافة فرصة تدريب جديدة</h2>

        <div class="success-msg" x-ref="successMsg">تم إضافة الفرصة بنجاح!</div>
        <div class="error-msg" x-ref="errorMsg" x-text="errorText"></div>

        <form @submit.prevent="submit">
            <div class="form-group">
                <label>عنوان الفرصة *</label>
                <input type="text" x-model="form.title" required placeholder="مثال: مطور واجهات خلفية (Laravel)">
            </div>

            <div class="form-group">
                <label>الوصف *</label>
                <textarea x-model="form.description" required placeholder="اكتب وصفاً شاملاً عن التدريب..."></textarea>
            </div>

            <div class="flex-row">
                <div class="form-group">
                    <label>التخصص المستهدف</label>
                    <select x-model="form.specialization_id">
                        <option value="">-- كل التخصصات --</option>
                        <template x-for="spec in specializations" :key="spec.id">
                            <option :value="spec.id" x-text="spec.name"></option>
                        </template>
                    </select>
                </div>
                <div class="form-group">
                    <label>عدد الطلاب المطلوب</label>
                    <input type="number" x-model="form.seats_count" min="1" placeholder="مثال: 5">
                </div>
            </div>

            <div class="flex-row">
                <div class="form-group">
                    <label>المدينة *</label>
                    <input type="text" x-model="form.city" required placeholder="مثال: طرابلس">
                </div>
                <div class="form-group">
                    <label>تفاصيل الموقع</label>
                    <input type="text" x-model="form.location_text" placeholder="مثال: شارع الجمهورية، بجانب...">
                </div>
            </div>

            <div class="flex-row">
                <div class="form-group">
                    <label>مدة التدريب (بالأيام)</label>
                    <input type="number" x-model="form.duration_days" min="1" placeholder="مثال: 90">
                </div>
                <div class="form-group">
                    <label>حالة النشر</label>
                    <select x-model="form.status">
                        <option value="draft">مسودة</option>
                        <option value="published">نشر (مرئي للطلاب)</option>
                    </select>
                </div>
            </div>

            <div class="flex-row">
                <div class="form-group">
                    <label>تاريخ البدء</label>
                    <input type="date" x-model="form.start_date">
                </div>
                <div class="form-group">
                    <label>تاريخ الانتهاء</label>
                    <input type="date" x-model="form.end_date">
                </div>
                <div class="form-group">
                    <label>آخر موعد للتقديم</label>
                    <input type="date" x-model="form.application_deadline">
                </div>
            </div>

            <button type="submit" class="submit-btn" :disabled="loading">
                <span x-show="!loading"><i class="ri-save-line"></i> حفظ ونشر</span>
                <span x-show="loading">جاري الحفظ...</span>
            </button>
        </form>
    </div>

    <script>
        function opportunityForm() {
            return {
                loading: false,
                specializations: [],
                errorText: '',
                form: {
                    title: '',
                    description: '',
                    specialization_id: '',
                    city: '',
                    location_text: '',
                    seats_count: '',
                    duration_days: '',
                    start_date: '',
                    end_date: '',
                    application_deadline: '',
                    status: 'published'
                },

                async init() {
                    try {
                        const response = await apiFetch('/company/specializations');
                        if (response.ok) {
                            const data = await response.json();
                            this.specializations = data.data || [];
                        }
                    } catch(e) { console.error('Failed to load specializations', e); }
                },

                async submit() {
                    this.loading = true;
                    this.$refs.successMsg.style.display = 'none';
                    this.$refs.errorMsg.style.display = 'none';

                    try {
                        const payload = { ...this.form };
                        // Convert numeric fields
                        if (payload.seats_count) payload.seats_count = parseInt(payload.seats_count);
                        if (payload.duration_days) payload.duration_days = parseInt(payload.duration_days);
                        if (payload.specialization_id) payload.specialization_id = parseInt(payload.specialization_id);
                        // Remove empty optional fields
                        if (!payload.specialization_id) delete payload.specialization_id;
                        if (!payload.seats_count) delete payload.seats_count;
                        if (!payload.duration_days) delete payload.duration_days;
                        if (!payload.location_text) delete payload.location_text;
                        if (!payload.start_date) delete payload.start_date;
                        if (!payload.end_date) delete payload.end_date;
                        if (!payload.application_deadline) delete payload.application_deadline;

                        const response = await apiFetch('/company/opportunities', {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        });

                        const data = await response.json();

                        if (response.ok) {
                            this.$refs.successMsg.style.display = 'block';
                            this.form.title = '';
                            this.form.description = '';
                            this.form.specialization_id = '';
                            this.form.city = '';
                            this.form.location_text = '';
                            this.form.seats_count = '';
                            this.form.duration_days = '';
                            this.form.start_date = '';
                            this.form.end_date = '';
                            this.form.application_deadline = '';
                        } else {
                            this.errorText = data.message || 'تعذر إضافة الفرصة. تحقق من البيانات المدخلة.';
                            this.$refs.errorMsg.style.display = 'block';
                        }
                    } catch (error) {
                        this.errorText = 'حدث خطأ في الاتصال بالخادم.';
                        this.$refs.errorMsg.style.display = 'block';
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
