<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلبات الطلبة - وصلة تدريب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css"> 
    <link rel="stylesheet" href="students_requests.css"> 
    <style>
        /* إضافات بسيطة لضمان مظهر نظيف داخل الإطار */
        body { 
            background: transparent; 
            margin: 0; 
            padding: 0; 
        }
        .main-content { 
            margin: 0; 
            padding: 20px; 
            width: 100%;
        }
    </style>
</head>
<body>

    <main class="main-content">
        <header class="content-header animate-up">
            <div class="header-title">
                <h2>طلبات التدريب الواردة</h2>
                <p>إدارة طلبات الطلاب المتقدمين للفرص التدريبية</p>
            </div>
        </header>

        <div class="requests-grid">
            <div class="request-card animate-up">
                <div class="card-header">
                    <div class="avatar">أ م</div>
                    <div class="main-info">
                        <h4>أحمد محمد علي</h4>
                        <span class="id-tag">رقم القيد: 2190045</span>
                    </div>
                </div>
                
                <div class="card-body">
                    <div class="data-item">
                        <i class="ri-briefcase-line"></i>
                        <div>
                            <label>التخصص</label>
                            <p>حاسب آلي (تطوير ويب)</p>
                        </div>
                    </div>
                    <div class="data-item">
                        <i class="ri-mail-line"></i>
                        <div>
                            <label>البريد الإلكتروني</label>
                            <p>ahmed.m@techno.ly</p>
                        </div>
                    </div>
                </div>

                <div class="card-footer">
                    <button class="action-btn accept">قبول الطلب</button>
                    <button class="action-btn reject">رفض الطلب</button>
                </div>
            </div>

            <div class="request-card animate-up">
                <div class="card-header">
                    <div class="avatar" style="background: #ff8c00;">س ع</div>
                    <div class="main-info">
                        <h4>سارة علي عبد الله</h4>
                        <span class="id-tag">رقم القيد: 2201156</span>
                    </div>
                </div>
                
                <div class="card-body">
                    <div class="data-item">
                        <i class="ri-briefcase-line"></i>
                        <div>
                            <label>التخصص</label>
                            <p>اتصالات</p>
                        </div>
                    </div>
                    <div class="data-item">
                        <i class="ri-mail-line"></i>
                        <div>
                            <label>البريد الإلكتروني</label>
                            <p>sara.ali@mail.com</p>
                        </div>
                    </div>
                </div>

                <div class="card-footer">
                    <button class="action-btn accept">قبول الطلب</button>
                    <button class="action-btn reject">رفض الطلب</button>
                </div>
            </div>
        </div>
    </main>

    <script src="students_requests.js"></script>
</body>
</html>
