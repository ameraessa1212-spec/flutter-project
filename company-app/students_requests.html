<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلبات الطلبة - وصلة تدريب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="students_requests.css">
    <script src="config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { background: transparent; margin: 0; padding: 0; height: auto; overflow: auto; }
        .main-content { margin: 0; padding: 20px; width: 100%; box-sizing: border-box; }
        .requests-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px;}
        .request-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px;}
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: #6A5AE0; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem;}
        .main-info h4 { margin: 0 0 5px 0; color: #1e293b; }
        .id-tag { font-size: 0.85rem; color: #6A5AE0; background: #f1f5f9; padding: 4px 8px; border-radius: 6px;}
        .card-body { margin-bottom: 20px;}
        .data-item { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start;}
        .data-item i { color: #6A5AE0; font-size: 1.2rem;}
        .data-item label { font-size: 0.8rem; color: #94a3b8; display: block;}
        .data-item p { margin: 2px 0 0 0; font-size: 0.95rem; color: #334155; font-weight: 600;}
        .card-footer { display: flex; gap: 10px;}
        .action-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s;}
        .action-btn.accept { background: #dcfce7; color: #166534; }
        .action-btn.accept:hover { background: #bbf7d0; }
        .action-btn.reject { background: #fee2e2; color: #991b1b; }
        .action-btn.reject:hover { background: #fecaca; }
        .empty-state { text-align: center; padding: 3rem; color: #64748b; width: 100%; grid-column: 1 / -1;}
    </style>
</head>
<body x-data="requestsManager()">
    <main class="main-content">
        <header class="content-header animate-up">
            <div class="header-title">
                <h2>طلبات التدريب الواردة</h2>
                <p>إدارة طلبات الطلاب المتقدمين للفرص التدريبية</p>
            </div>
            <div x-show="loading" style="color: #6A5AE0; font-weight: bold;">جاري التحميل...</div>
        </header>

        <div class="requests-grid">
            <template x-for="req in requests" :key="req.id">
                <div class="request-card animate-up">
                    <div class="card-header">
                        <div class="avatar" x-text="getInitials(req.student?.name || 'طالب')"></div>
                        <div class="main-info">
                            <h4 x-text="req.full_name_snapshot || req.student?.name || 'اسم غير متوفر'"></h4>
                            <span class="id-tag" x-text="req.opportunity?.title || 'عام'"></span>
                        </div>
                    </div>
                    
                    <div class="card-body">
                        <div class="data-item">
                            <i class="ri-user-settings-line"></i>
                            <div>
                                <label>رقم القيد</label>
                                <p x-text="req.student?.student_profile?.student_number || '---'"></p>
                            </div>
                        </div>
                        <div class="data-item">
                            <i class="ri-mail-line"></i>
                            <div>
                                <label>البريد الإلكتروني</label>
                                <p x-text="req.email_snapshot || req.student?.email || '---'"></p>
                            </div>
                        </div>
                        <div class="data-item">
                            <i class="ri-phone-line"></i>
                            <div>
                                <label>رقم الهاتف</label>
                                <p x-text="req.phone_snapshot || req.student?.phone || '---'"></p>
                            </div>
                        </div>
                        <div class="data-item">
                            <i class="ri-building-line"></i>
                            <div>
                                <label>الجامعة</label>
                                <p x-text="req.university_snapshot || req.student?.student_profile?.university_name || '---'"></p>
                            </div>
                        </div>
                        <div class="data-item">
                            <i class="ri-book-mark-line"></i>
                            <div>
                                <label>التخصص</label>
                                <p x-text="req.student?.student_profile?.specialization?.name || req.major_snapshot || '---'"></p>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer" x-show="req.status === 'pending' || req.status === 'reviewing'">
                        <button class="action-btn accept" @click="updateStatus(req.id, 'accepted')" :disabled="processing === req.id">
                            <span x-show="processing !== req.id">قبول </span>
                            <span x-show="processing === req.id">جاري...</span>
                        </button>
                        <button class="action-btn reject" @click="updateStatus(req.id, 'rejected')" :disabled="processing === req.id">
                            رفض
                        </button>
                    </div>
                    <div class="card-footer" x-show="req.status !== 'pending' && req.status !== 'reviewing'">
                        <div style="text-align: center; width: 100%; padding: 10px; border-radius: 12px; font-weight: bold;" 
                             :style="req.status === 'accepted' ? 'background: #dcfce7; color: #166534;' : 'background: #fee2e2; color: #991b1b;'">
                            <span x-text="req.status === 'accepted' ? 'تم القبول ✅' : 'مرفوض ❌'"></span>
                        </div>
                    </div>
                </div>
            </template>
            
            <div x-show="!loading && requests.length === 0" class="empty-state">
                <i class="ri-inbox-line" style="font-size: 3rem; color: #cbd5e1;"></i>
                <h3>لا توجد طلبات تدريب حالياً</h3>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('requestsManager', () => ({
                requests: [],
                loading: true,
                processing: null,

                init() {
                    this.fetchRequests();
                },

                async fetchRequests() {
                    this.loading = true;
                    try {
                        const response = await apiFetch('/company/requests');
                        if (response.ok) {
                            this.requests = await response.json();
                        }
                    } catch (error) {
                        console.error('Error:', error);
                    } finally {
                        this.loading = false;
                    }
                },

                async updateStatus(id, status) {
                    if (status === 'rejected' && !confirm('هل أنت متأكد من رفض هذا الطلب؟')) return;
                    
                    this.processing = id;
                    try {
                        const response = await apiFetch('/company/requests/' + id + '/status', {
                            method: 'PUT',
                            body: JSON.stringify({ status })
                        });
                        
                        if (response.ok) {
                            const index = this.requests.findIndex(r => r.id === id);
                            if (index !== -1) {
                                this.requests[index].status = status;
                            }
                            if(status === 'accepted'){
                                 setTimeout(() => { window.parent.location.reload(); }, 1500);
                            }
                        } else {
                            alert('حدث خطأ أثناء التحديث.');
                        }
                    } catch (error) {
                        alert('تعذر الاتصال بالخادم.');
                    } finally {
                        this.processing = null;
                    }
                },

                getInitials(name) {
                    if (!name) return '؟';
                    const parts = name.trim().split(' ');
                    if (parts.length > 1) {
                        return (parts[0][0] + ' ' + parts[1][0]).toUpperCase();
                    }
                    return name.substring(0, 2).toUpperCase();
                }
            }));
        });
    </script>
</body>
</html>
