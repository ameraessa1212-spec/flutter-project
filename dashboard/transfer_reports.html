<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة تحويل التقارير | نظام التدريب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="transfer_reports.css">
</head>
<body>

<div class="page-container">
    <header class="page-header">
        <div class="text">
            <h1>تحويل تقارير التدريب 📁</h1>
            <p>قم بتحديد الطلاب وتوجيههم للممتحن المختص حسب التخصص.</p>
        </div>
    </header>

    <div class="toolbar">
        <div class="search-box">
            <i class="ri-search-2-line"></i>
            <input type="text" id="searchInput" placeholder="ابحث باسم الطالب أو رقم القيد...">
        </div>
        
        <div class="filter-box">
            <i class="ri-filter-3-line"></i>
            <select id="deptFilter" onchange="filterBy(this.value)">
                <option value="all">جميع التخصصات</option>
                <option value="حاسب آلي">قسم الحاسب</option>
                <option value="اتصالات">قسم الاتصالات</option>
                <option value="تحكم">قسم التحكم</option>
            </select>
        </div>
    </div>

    <div class="control-panel">
        <div class="selection-status">
            <div class="status-icon"><i class="ri-checkbox-multiple-line"></i></div>
            <div class="status-text">
                <span>تم تحديد: <strong id="selectedCount">0</strong> طلاب</span>
                <small>التخصص الحالي: <strong id="currentDept">الكل</strong></small>
            </div>
        </div>

        <div class="transfer-actions">
            <div class="select-wrapper">
                <i class="ri-user-follow-line"></i>
                <select id="examinerList">
                    <option selected disabled>اختر الممتحن المختص...</option>
                    <option>د. أحمد (حاسب آلي)</option>
                    <option>د. سارة (اتصالات)</option>
                    <option>د. خالد (تحكم)</option>
                </select>
            </div>
            <button class="primary-btn" onclick="bulkTransfer()">
                <span>تحويل الآن</span>
                <i class="ri-send-plane-fill"></i>
            </button>
        </div>
    </div>

    <div class="table-card">
        <table class="modern-table">
            <thead>
                <tr>
                    <th class="check-col">
                        <input type="checkbox" id="selectAll" onclick="toggleSelectAll()">
                    </th>
                    <th>اسم الطالب</th>
                    <th>رقم القيد</th>
                    <th>التخصص</th>
                    <th>التقارير</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="reportsTable">
                <tr data-dept="حاسب آلي">
                    <td><input type="checkbox" class="row-checkbox" onclick="updateCount()"></td>
                    <td class="user-cell"><strong>محمد المصراتي</strong></td>
                    <td>2024102</td>
                    <td><span class="tag cs">حاسب آلي</span></td>
                    <td><button class="icon-btn"><i class="ri-folder-zip-fill"></i></button></td>
                    <td><span class="status ready">جاهز للتحويل</span></td>
                </tr>
                <tr data-dept="اتصالات">
                    <td><input type="checkbox" class="row-checkbox" onclick="updateCount()"></td>
                    <td class="user-cell"><strong>سارة محمود</strong></td>
                    <td>220155</td>
                    <td><span class="tag comms">اتصالات</span></td>
                    <td><button class="icon-btn"><i class="ri-folder-zip-fill"></i></button></td>
                    <td><span class="status ready">جاهز للتحويل</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="transfer_reports.js"></script>
</body>
</html>
