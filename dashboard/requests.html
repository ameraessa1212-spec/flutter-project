<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الطلبات الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="requests.css">
</head>
<body>
    <div class="light-blobs">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
    </div>

    <div class="glass-container">
        <header class="neo-header-wrapper">
            <div class="header-border-animation"></div>
            <div class="header-content">
                <div class="title-section">
                    <h1 class="all-purple">سجل الطلبات </h1>
                    <p>بيانات طلبة التدريب الميداني -الفصل الثامن</p>
                </div>
                <div class="stats-box">
                    <div class="stats-icon"><i class="ri-pulse-line"></i></div>
                    <div class="stats-text">
                        <span class="label">طلبات معلقة</span>
                        <span class="number">05</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="timeline-wrapper" id="requestsContainer">
            </div>
    </div>

    <script src="api.js"></script>
    <script src="requests.js"></script>
</body>
</html>
