<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الممتحن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="examiner_style.css">
    <link rel="stylesheet" href="reports.css">
    <style>
        .main-content { transition: opacity 0.15s ease; }
        .page-panel { padding: 25px; }
        .loading-text { text-align: center; color: #aaa; padding: 40px; }
        .empty-text { text-align: center; color: #aaa; padding: 40px; }
        .styled-table { width: 100%; border-collapse: collapse; }
        .styled-table th, .styled-table td { padding: 12px 15px; text-align: right; border-bottom: 1px solid #f0f0f0; }
        .styled-table th { background: #f8f9fd; font-weight: 700; color: #555; }
        .eval-btn { background: #6A5AE0; color: #fff; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-family: Cairo; }
        .status-tag { padding: 4px 12px; border-radius: 20px; font-size: 12px; background: #f0f0f0; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 20px; padding: 25px; max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 class="sidebar-logo">بوابة الممتحن</h2>
        <ul class="menu">
            <li class="menu-item active" onclick="loadExaminerPage('home', this)">
                <i class="ri-dashboard-line"></i> <span>الرئيسية</span>
            </li>
            <li class="menu-item" onclick="loadExaminerPage('reports', this)">
                <i class="ri-file-text-line"></i> <span>تقارير الطلاب</span>
            </li>
            <li class="menu-item" onclick="loadExaminerPage('grades', this)">
                <i class="ri-medal-line"></i> <span>نتائج التقييم</span>
            </li>
            <li class="menu-item" onclick="loadExaminerPage('schedule', this)">
                <i class="ri-calendar-event-line"></i> <span>جدول المناقشة</span>
            </li>
        </ul>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="handleExaminerLogout()">
                <i class="ri-logout-box-r-line"></i> تسجيل الخروج
            </button>
        </div>
    </div>

    <div class="main-content" id="mainArea">
        <p class="loading-text">جاري التحميل...</p>
    </div>

    <script src="api.js"></script>
    <script src="examiner_app.js"></script>
</body>
</html>
