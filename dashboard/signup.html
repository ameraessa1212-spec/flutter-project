<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب جديد - بوابة الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mesh-gradient"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-logo" style="width: 50px; height: 50px; font-size: 22px; margin-bottom: 10px;">
                    <i class="ri-user-add-fill"></i>
                </div>
                <h1 style="font-size: 20px;">حساب جديد</h1>
                <p style="margin-bottom: 15px;">انضم إلينا وابدأ رحلتك الآن</p>
            </div>

            <form class="auth-form" onsubmit="handleSignup(event)">
                <div class="input-wrapper" style="margin-bottom: 12px;">
                    <label class="field-label">اسم المستخدم</label>
                    <div class="input-box">
                        <i class="ri-user-3-line"></i>
                        <input type="text" placeholder="اسم المستخدم" required>
                    </div>
                </div>

                <div class="input-wrapper" style="margin-bottom: 12px;">
                    <label class="field-label">البريد الإلكتروني</label>
                    <div class="input-box">
                        <i class="ri-mail-line"></i>
                        <input type="email" placeholder="example@mail.com" required>
                    </div>
                </div>
                
                <div class="input-wrapper" style="margin-bottom: 12px;">
                    <label class="field-label">كلمة المرور</label>
                    <div class="input-box">
                        <i class="ri-lock-2-line"></i>
                        <input type="password" placeholder="كلمة المرور" required>
                    </div>
                </div>

                <div class="input-wrapper" style="margin-bottom: 12px;">
                    <label class="field-label">تأكيد كلمة المرور</label>
                    <div class="input-box">
                        <i class="ri-lock-check-line"></i>
                        <input type="password" placeholder="تأكيد كلمة المرور" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn" style="height: 48px; margin-top: 5px;">
                    <span>إنشاء الحساب</span>
                    <i class="ri-checkbox-circle-fill"></i>
                </button>
            </form>

<div class="signup-section">
    <span>لديك حساب بالفعل؟</span>
    <a href="index.html" class="signup-link">تسجيل الدخول</a>
</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
