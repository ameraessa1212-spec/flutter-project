<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحقق من البريد - بوابة الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* تنسيق خاص بخانات الكود */
        .otp-container { display: flex; gap: 10px; justify-content: center; margin: 20px 0; direction: ltr; }
        .otp-input {
            width: 50px; height: 60px; text-align: center; font-size: 24px;
            font-weight: bold; border: 2px solid #EAEAEA; border-radius: 12px;
            background: #fff; outline: none; transition: 0.3s;
        }
        .otp-input:focus { border-color: var(--main-color); box-shadow: 0 0 10px rgba(106, 90, 224, 0.1); }
    </style>
</head>
<body>
    <div class="mesh-gradient"></div>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-logo"><i class="ri-mail-check-line"></i></div>
                <h1>تحقق من بريدك</h1>
                <p>أدخل الكود المكون من 4 أرقام المرسل لبريدك</p>
            </div>

            <form onsubmit="handleVerify(event)">
                <div class="otp-container">
                    <input type="text" maxlength="1" class="otp-input" required>
                    <input type="text" maxlength="1" class="otp-input" required>
                    <input type="text" maxlength="1" class="otp-input" required>
                    <input type="text" maxlength="1" class="otp-input" required>
                </div>

                <button type="submit" class="submit-btn">
                    <span>تأكيد الرمز</span>
                    <i class="ri-shield-check-line"></i>
                </button>
            </form>

            <div class="signup-section">
                <span>لم يصلك الكود؟</span>
                <a href="#" class="signup-link">إعادة إرسال</a>
            </div>
        </div>
    </div>

    <script>
        function handleVerify(event) {
            event.preventDefault();
            const btn = document.querySelector('.submit-btn');
            btn.innerHTML = '<i class="ri-loader-4-line rotate"></i> جاري التحقق...';
            
            setTimeout(() => {
                alert("تم التحقق بنجاح! تم إنشاء حسابك.");
                window.location.href = "index.html";
            }, 2000);
        }

        // تحريك التركيز تلقائياً بين خانات الكود
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                if (input.value && index < inputs.length - 1) inputs[index + 1].focus();
            });
        });
    </script>
</body>
</html>
