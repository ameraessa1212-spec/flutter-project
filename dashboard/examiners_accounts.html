<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة حسابات الممتحنين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="examiners_accounts.css">
</head>
<body>

<div class="page-container">
    <header class="page-header">
        <div class="header-content">
            <h1>إدارة حسابات الممتحنين <span class="icon-glow">🔐</span></h1>
            <p>التحكم في وصول الممتحنين المعتمدين للنظام وتعديل صلاحياتهم الفورية.</p>
        </div>
    </header>

    <div class="toolbar">
        <div class="search-box">
            <i class="ri-search-2-line"></i>
            <input type="text" id="examinerSearch" placeholder="ابحث باسم الممتحن، التخصص، أو البريد الإلكتروني...">
        </div>
    </div>

    <div class="table-card">
        <table class="modern-table">
            <thead>
                <tr>
                    <th>الممتحن</th>
                    <th>البريد الإلكتروني</th>
                    <th>الهاتف</th>
                    <th>الحالة</th>
                    <th>الإجراء</th>
                </tr>
            </thead>
            <tbody id="examinersTable">
                <tr><td colspan="5" style="text-align:center; color:#aaa; padding:20px;">جاري التحميل...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="api.js"></script>
<script src="examiners_accounts.js"></script>
</body>
</html>
