<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة حسابات الممتحنين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="examiners_accounts.css">
</head>
<body>

<div class="page-container">
    <header class="page-header">
        <div class="header-content">
            <h1>إدارة حسابات الممتحنين <span class="icon-glow">🔐</span></h1>
            <p>التحكم في وصول الممتحنين المعتمدين للنظام وتعديل صلاحياتهم الفورية.</p>
        </div>
    </header>

    <div class="toolbar">
        <div class="search-box">
            <i class="ri-search-2-line"></i>
            <input type="text" id="examinerSearch" placeholder="ابحث باسم الممتحن، التخصص، أو البريد الإلكتروني...">
        </div>
    </div>

    <div class="table-card">
        <table class="modern-table">
            <thead>
                <tr>
                    <th>الممتحن</th>
                    <th>التخصص</th>
                    <th>البريد الإلكتروني</th>
                    <th>كلمة المرور</th>
                    <th>الحالة</th>
                    <th>الإجراء</th>
                </tr>
            </thead>
            <tbody id="examinersTable">
                <tr>
                    <td class="user-cell"><strong>د. أحمد المبروك</strong></td>
                    <td><span class="tag cs">حاسب آلي</span></td>
                    <td class="email-cell">ahmed.m@edu.ly</td>
                    <td><code>Pass#2024</code></td>
                    <td><span class="status-badge active">نشط</span></td>
                    <td><button class="action-btn toggle-status" onclick="toggleAccount(this)">تعطيل</button></td>
                </tr>
                <tr>
                    <td class="user-cell"><strong>د. سارة محمود</strong></td>
                    <td><span class="tag comms">اتصالات</span></td>
                    <td class="email-cell">sara.comm@edu.ly</td>
                    <td><code>Sara@9933</code></td>
                    <td><span class="status-badge inactive">معطل</span></td>
                    <td><button class="action-btn toggle-status activate" onclick="toggleAccount(this)">تفعيل</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="examiners_accounts.js"></script>
</body>
</html>
