<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال جدول المناقشات | وصلة تدريب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="admin_discussion_styles.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <div>
                <h2>إرسال جدول المناقشات</h2>
                <p class="sub-header-text">قم برفع صورة الجدول من جهازك واختيار المستلمين</p>
            </div>
        </header>

        <div class="upload-section">
            <input type="file" id="fileInput" hidden accept="image/*" onchange="previewImage(event)">
            <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                <i class="ri-image-add-line"></i>
                <p id="uploadText">اضغط هنا لاختيار صورة الجدول من جهازك</p>
                <img id="imagePreview" src="" style="display:none; max-width: 100%; border-radius: 10px; margin-top: 10px;">
            </div>
        </div>

        <hr style="border: 1px solid #f1f1f1; margin: 25px 0;">

        <div class="send-settings">
            <h3>1. تحديد المستلمين</h3>
            <div class="tabs">
                <div class="tab" onclick="toggleTarget('examiners', this)">الممتحنين</div>
                <div class="tab" onclick="toggleTarget('students', this)">الطلاب</div>
            </div>

            <h3>2. فلترة حسب التخصص:</h3>
            <div class="tabs">
                <div class="tab active" onclick="filterDept('all', this)">الكل</div>
                <div class="tab" onclick="filterDept('computer', this)">حاسب آلي</div>
                <div class="tab" onclick="filterDept('control', this)">تحكم</div>
                <div class="tab" onclick="filterDept('telecom', this)">اتصالات</div>
            </div>

            <h3>3. إضافة رسالة أو ملاحظة (اختياري):</h3>
            <textarea id="messageInput" class="message-area" placeholder="اكتب هنا الرسالة التي ستظهر فوق الجدول..."></textarea>

            <button class="btn-send" onclick="sendToSelected()">
                <i class="ri-send-plane-fill"></i> إرسال الآن
            </button>
        </div>
    </div>

    <script src="admin_discussion_logic.js"></script>
</body>
</html>
