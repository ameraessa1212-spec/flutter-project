<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة استيراد الطلاب | النسخة الاحترافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="upload_students.css">
</head>
<body>
    <div class="light-blobs">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
    </div>

    <div class="main-wrapper">
        <header class="page-header">
            <h1>مركز رفع <span class="bold-text">البيانات الرقمية</span></h1>
            <p>تحميـل  قوائـم  طلبة التـدريب المـيداني-الفصل الثامن</p>
        </header>

        <div class="content-grid">
            <div class="upload-zone" id="dropZone">
                <div class="scan-bar"></div>
                <div class="zone-core">
                    <div class="orbit-box">
                        <i class="ri-upload-cloud-2-line main-cloud"></i>
                        <i class="ri-file-pdf-line orbit-pdf"></i>
                        <i class="ri-file-excel-line orbit-excel"></i>
                    </div>
                    <h3>اسحب ملفك هنا</h3>
                    <p>أو انقر لاختيار الملف من جهازك</p>
                    
                    <div class="formats-tags">
                        <span class="tag">PDF</span>
                        <span class="tag">XLSX</span>
                        <span class="tag">CSV</span>
                    </div>
                    <input type="file" id="fileInput" hidden accept=".pdf, .xlsx, .csv">
                </div>
            </div>

            <aside class="data-panel" id="previewPanel">
                <div class="panel-header">
                    <h3>قائمة الطلاب  </h3>
                    <div class="panel-actions">
                        <button class="btn-cancel" id="cancelBtn">
                            <i class="ri-delete-bin-line"></i> إلغاء
                        </button>
                        <button class="btn-approve">تأكيد الحفظ</button>
                    </div>
                </div>
                <div class="stream-list" id="namesList"></div>
            </aside>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="upload_students.js"></script>
</body>
</html>
