<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة النتائج النهائية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="student_evaluation.css">
</head>
<body>
    <div class="list-container">
        <header class="list-header">
            <div class="title-section">
                <h1><i class="ri-medal-2-line"></i> لوحة النتائج النهائية</h1>
                <p>استعراض نتائج التدريب الميداني لجميع الطلاب</p>
            </div>
            <div class="header-actions">
                <div class="search-wrapper">
                    <i class="ri-search-line"></i>
                    <input type="text" id="studentSearch" placeholder="ابحث باسم الطالب أو الشركة...">
                </div>
                <button class="export-btn"><i class="ri-file-excel-2-line"></i> تصدير الكل</button>
            </div>
        </header>

        <div class="results-grid" id="resultsGrid">
            <p style="text-align:center; color:#aaa; padding:40px; grid-column:1/-1;">جاري التحميل...</p>
        </div>
    </div>
    <script src="api.js"></script>
    <script src="student_evaluation.js"></script>
</body>
</html>
