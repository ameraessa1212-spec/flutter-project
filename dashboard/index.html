<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدخول الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mesh-gradient"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-logo">
                    <i class="ri-shield-flash-line"></i>
                </div>
                <h1>مرحباً بك </h1>
                <p>يرجى إدخال بياناتك للدخول</p>
            </div>

            <div class="role-selection">
                <input type="radio" name="userRole" id="adminRole" value="admin" checked>
                <label for="adminRole" class="role-item">
                    <i class="ri-settings-5-fill"></i>
                    <span>مشرف</span>
                </label>

                <input type="radio" name="userRole" id="examRole" value="examiner">
                <label for="examRole" class="role-item">
                    <i class="ri-user-star-fill"></i>
                    <span>ممتحن</span>
                </label>
            </div>

            <form class="auth-form" onsubmit="handleLogin(event)">
                <div class="input-wrapper">
                    <label class="field-label">اسم المستخدم</label>
                    <div class="input-box">
                        <i class="ri-user-3-line"></i>
                        <input type="text" placeholder="اسم المستخدم" required>
                    </div>
                </div>
                
                <div class="input-wrapper">
                    <label class="field-label">كلمة المرور</label>
                    <div class="input-box">
                        <i class="ri-lock-2-line"></i>
                        <input type="password" placeholder="كلمة المرور" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <span>تسجيل الدخول</span>
                    <i class="ri-arrow-left-s-line"></i>
                </button>
            </form>

<div class="signup-section">
    <span>ليس لديك حساب؟</span>
    <a href="signup.html" class="signup-link">إنشاء حساب</a>
</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
