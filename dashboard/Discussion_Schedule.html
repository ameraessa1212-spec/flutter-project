<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول المناقشات - بوابة الممتحن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="Discussion_Schedule.css">
</head>
<body>
    <div class="glass-background">
        <div class="glow-sphere s1"></div>
        <div class="glow-sphere s2"></div>
    </div>

    <div class="container animate-fade">
        <header class="schedule-header">
            <div class="header-info">
                <h1 class="purple-grad">جدول المناقشات العلمية</h1>
                <p><i class="ri-community-line"></i> القسم: <span id="deptName">هندسة البرمجيات</span></p>
            </div>
            <div class="action-bar">
                
                <button class="tool-btn print" onclick="printPDF()" title="طباعة">
                    <i class="ri-printer-line"></i> طباعة
                </button>
                <button class="tool-btn download" onclick="downloadPDF()" title="تحميل">
                    <i class="ri-download-cloud-line"></i> تحميل
                </button>
            </div>
        </header>

        <main class="pdf-viewer-container">
            <div class="pdf-toolbar">
                <span><i class="ri-file-pdf-fill"></i> معاينة جدول المناقشات.pdf</span>
                <button class="full-view-btn" onclick="openFullView()">
                    <i class="ri-external-link-line"></i> فتح الشاشة الكاملة
                </button>
            </div>
            
            <div class="pdf-frame" id="pdfArea">
                <iframe src="schedule_sample.pdf" id="pdfFrame" frameborder="0"></iframe>
                </div>
        </main>
    </div>
    <div id="fullViewModal" class="full-modal">
    <span class="close-full" onclick="closeFullView()">&times;</span>
    <img id="imgFull" src="image_daed9c.jpg" alt="عرض كامل">
</div>

    <script src="api.js"></script>
    <script src="Discussion_Schedule.js"></script>
</body>
</html>
